<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Campar Química – Sete Lagoas</title>
<meta name="description" content="Catálogo de produtos de limpeza profissional Campar Química – Sete Lagoas, MG. Limpeza geral, automotivo, lavanderia e mais. Faça seu pedido pelo WhatsApp.">
<meta property="og:title" content="Campar Química – Catálogo de Produtos">
<meta property="og:description" content="Produtos de limpeza profissional para uso doméstico, automotivo e industrial. Peça pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:image" content="campar_img/logo.png">
<style>
  :root{
    --az:#0D3187;--az2:#1752C8;--ciano:#00B4D8;--ciano2:#0096B4;
    --bg:#F0F5FF;--card:#fff;--texto:#1a1a2e;--sub:#555;
    --preco:#0D3187;--borda:#D0DCEF;--raio:14px;
    --sombra:0 2px 16px rgba(13,49,135,.10);
    --sombra-h:0 6px 28px rgba(13,49,135,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh}

  /* ── HEADER ── */
  header{
    background:linear-gradient(135deg,var(--az) 0%,var(--az2) 100%);
    padding:0;position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
  }
  .header-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;gap:10px;
  }
  .logo-wrap img{height:46px;object-fit:contain}
  .header-title{flex:1;text-align:center}
  .header-title h1{font-size:1.05rem;font-weight:700;color:#fff;line-height:1.2}
  .header-title p{font-size:.72rem;color:#9CC4E4;margin-top:1px}
  .cart-btn{
    position:relative;background:var(--ciano);border:none;color:#fff;
    border-radius:50%;width:44px;height:44px;font-size:1.2rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,180,216,.4);flex-shrink:0;
    transition:transform .15s;
  }
  .cart-btn:active{transform:scale(.92)}
  .cart-badge{
    position:absolute;top:-4px;right:-4px;background:#FF3B3B;
    color:#fff;border-radius:50%;width:20px;height:20px;
    font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;
    display:none;
  }

  /* ── FILTROS ── */
  .cats-bar{
    display:flex;gap:8px;padding:10px 16px 10px;overflow-x:auto;
    scrollbar-width:none;background:linear-gradient(135deg,var(--az) 0%,var(--az2) 100%);
  }
  .cats-bar::-webkit-scrollbar{display:none}
  .cat-pill{
    flex-shrink:0;background:rgba(255,255,255,.15);color:#fff;
    border:1.5px solid rgba(255,255,255,.25);border-radius:20px;
    padding:6px 14px;font-size:.78rem;font-weight:600;cursor:pointer;
    white-space:nowrap;transition:all .2s;
  }
  .cat-pill.ativo{background:var(--ciano);border-color:var(--ciano);color:#fff;box-shadow:0 2px 10px rgba(0,180,216,.5)}

  /* ── BUSCA ── */
  .search-wrap{padding:14px 16px 4px}
  .search-wrap input{
    width:100%;border:1.5px solid var(--borda);border-radius:30px;
    padding:10px 18px;font-size:.9rem;background:#fff;color:var(--texto);
    outline:none;transition:border-color .2s;
  }
  .search-wrap input:focus{border-color:var(--ciano)}

  /* ── GRID PRODUTOS ── */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
    gap:14px;padding:14px 16px 100px;
  }
  @media(min-width:600px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding:18px 24px 120px}
  }
  @media(min-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:20px 32px 120px}
  }

  /* ── CARD ── */
  .card{
    background:var(--card);border-radius:var(--raio);
    box-shadow:var(--sombra);overflow:hidden;
    display:flex;flex-direction:column;
    transition:box-shadow .2s,transform .2s;cursor:pointer;
    border:1.5px solid var(--borda);
  }
  .card:hover{box-shadow:var(--sombra-h);transform:translateY(-3px)}
  .card-img{
    background:linear-gradient(160deg,#EEF4FF 0%,#F8FBFF 100%);
    display:flex;align-items:center;justify-content:center;
    padding:16px 12px 10px;min-height:160px;position:relative;
  }
  .card-img img{
    max-height:140px;max-width:100%;object-fit:contain;
    display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.12));
  }
  .cat-tag{
    position:absolute;top:8px;left:8px;
    background:var(--ciano);color:#fff;
    font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:10px;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .card-body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
  .card-nome{font-size:.9rem;font-weight:700;color:var(--az);line-height:1.25;margin-bottom:2px}
  .card-sub{font-size:.72rem;color:var(--ciano2);font-style:italic;margin-bottom:6px;line-height:1.3}
  .card-desc{font-size:.78rem;color:var(--sub);line-height:1.45;flex:1;margin-bottom:10px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-precos{margin-bottom:10px}
  .preco-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:3px 0;border-bottom:1px solid #EEF2FF;
  }
  .preco-item:last-child{border-bottom:none}
  .preco-tam{font-size:.72rem;color:var(--sub)}
  .preco-val{font-size:.82rem;font-weight:700;color:var(--preco)}
  .preco-cod{font-size:.6rem;color:#aaa}
  .add-btn{
    width:100%;padding:9px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--az) 0%,var(--az2) 100%);
    color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;
    transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .add-btn:active{transform:scale(.96);opacity:.9}

  /* ── MODAL PRODUTO ── */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(5,15,50,.6);
    z-index:200;backdrop-filter:blur(3px);align-items:flex-end;
    justify-content:center;
  }
  .overlay.open{display:flex}
  .modal{
    background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;
    max-height:92vh;overflow-y:auto;padding:0 0 24px;
    animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-header{
    position:sticky;top:0;background:#fff;padding:16px 16px 10px;
    border-bottom:1px solid #EEF2FF;display:flex;align-items:center;gap:12px;z-index:10;
  }
  .modal-close{
    background:none;border:none;font-size:1.4rem;cursor:pointer;color:#888;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;flex-shrink:0;
  }
  .modal-close:hover{background:#f0f4ff}
  .modal-img{
    background:linear-gradient(160deg,#EEF4FF 0%,#F8FBFF 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;min-height:200px;
  }
  .modal-img img{max-height:200px;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(0,0,0,.15))}
  .modal-body{padding:0 20px}
  .modal-nome{font-size:1.15rem;font-weight:700;color:var(--az);margin-bottom:4px;margin-top:16px}
  .modal-sub{font-size:.82rem;color:var(--ciano2);font-style:italic;margin-bottom:12px}
  .modal-desc{font-size:.87rem;color:#333;line-height:1.6;margin-bottom:16px}
  .modal-precos{background:#F0F5FF;border-radius:12px;padding:14px;margin-bottom:16px}
  .modal-precos h4{font-size:.78rem;color:var(--sub);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .modal-preco-row{
    display:flex;flex-direction:column;gap:8px;
    padding:10px 0;border-bottom:1px solid #D8E4F5;
  }
  .modal-preco-row:last-child{border-bottom:none}
  .mp-top{display:flex;align-items:center;justify-content:space-between}
  .mp-bottom{display:flex;align-items:center;justify-content:space-between}
  .mp-left{display:flex;flex-direction:column}
  .mp-tam{font-size:.82rem;font-weight:600;color:var(--az)}
  .mp-cod{font-size:.68rem;color:#999}
  .mp-val{font-size:1rem;font-weight:700;color:var(--preco)}
  .mp-add{
    background:var(--az2);color:#fff;border:none;border-radius:8px;
    padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer;
    transition:background .2s;
  }
  .mp-add:active{background:var(--az)}
  .mp-add.consulte,.add-btn.consulte{background:linear-gradient(135deg,var(--ciano2),var(--ciano))}

  /* ── QTD STEPPER ── */
  .mp-qty,.ci-qty{display:flex;align-items:center;gap:8px}
  .qty-btn{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--borda);
    background:#fff;color:var(--az);font-size:1rem;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;
  }
  .qty-btn:active{background:#EEF4FF}
  .qty-val{min-width:18px;text-align:center;font-size:.85rem;font-weight:700;color:var(--texto)}
  .ci-qty{margin-top:4px}
  .ci-qty .qty-btn{width:22px;height:22px;font-size:.85rem}
  .ci-qty .qty-val{font-size:.78rem}

  /* ── CARRINHO ── */
  .cart-overlay{
    display:none;position:fixed;inset:0;background:rgba(5,15,50,.6);
    z-index:300;backdrop-filter:blur(3px);align-items:flex-end;justify-content:center;
  }
  .cart-overlay.open{display:flex}
  .cart-modal{
    background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;
    max-height:90vh;overflow-y:auto;padding:0 0 24px;
    animation:slideUp .3s ease;
  }
  .cart-header{
    position:sticky;top:0;background:#fff;padding:16px 20px 12px;
    border-bottom:1px solid #EEF2FF;display:flex;align-items:center;justify-content:space-between;z-index:10;
  }
  .cart-header h2{font-size:1.05rem;font-weight:700;color:var(--az)}
  .cart-empty{text-align:center;padding:48px 20px;color:#aaa;font-size:.9rem}
  .cart-items{padding:12px 20px}
  .cart-item{
    display:flex;gap:12px;align-items:center;padding:12px 0;
    border-bottom:1px solid #EEF2FF;
  }
  .ci-img{width:52px;height:52px;object-fit:contain;background:#F0F5FF;border-radius:10px;padding:4px}
  .ci-info{flex:1}
  .ci-nome{font-size:.85rem;font-weight:700;color:var(--az);line-height:1.2}
  .ci-tam{font-size:.72rem;color:var(--sub)}
  .ci-preco{font-size:.85rem;font-weight:700;color:var(--preco);text-align:right}
  .ci-remove{
    background:none;border:none;color:#ccc;font-size:1.1rem;cursor:pointer;padding:4px;
    transition:color .2s;
  }
  .ci-remove:hover{color:#ff3b3b}
  .cart-total{
    padding:14px 20px;border-top:2px solid #EEF2FF;
    display:flex;justify-content:space-between;align-items:center;
  }
  .total-label{font-size:.85rem;color:var(--sub)}
  .total-val{font-size:1.2rem;font-weight:700;color:var(--az)}
  .wa-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:calc(100% - 40px);margin:4px 20px 0;
    padding:15px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#25D366,#128C7E);
    color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
    box-shadow:0 4px 16px rgba(37,211,102,.35);
    transition:opacity .2s,transform .15s;
  }
  .wa-btn:active{transform:scale(.97);opacity:.92}
  .wa-icon{width:26px;height:26px}

  /* ── TOAST ── */
  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--az);color:#fff;padding:10px 22px;border-radius:24px;
    font-size:.82rem;font-weight:600;opacity:0;transition:all .3s;z-index:500;
    white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── VAZIO ── */
  .no-results{text-align:center;padding:60px 20px;color:#aaa;font-size:.9rem;grid-column:1/-1}

  /* ── WHATSAPP FLUTUANTE ── */
  .wa-fab{
    position:fixed;right:16px;bottom:16px;z-index:150;
    width:56px;height:56px;border-radius:50%;border:none;
    background:linear-gradient(135deg,#25D366,#128C7E);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(37,211,102,.45);
    cursor:pointer;transition:transform .15s;
  }
  .wa-fab:active{transform:scale(.92)}
  .wa-fab svg{width:30px;height:30px;fill:#fff}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-wrap"><img src="campar_img/logo.png" alt="Campar Química"></div>
    <div class="header-title">
      <h1>Campar Química</h1>
      <p>Sete Lagoas · MG</p>
    </div>
    <button class="cart-btn" onclick="abrirCarrinho()" aria-label="Carrinho">
      🛒
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
  <div class="cats-bar" id="catsBar">
    <button class="cat-pill ativo" data-cat="Todos" onclick="filtrarCat(this,'Todos')">Todos</button>
    <button class="cat-pill" data-cat="Limpeza Geral" onclick="filtrarCat(this,'Limpeza Geral')">🧹 Limpeza Geral</button>
    <button class="cat-pill" data-cat="Automotivo" onclick="filtrarCat(this,'Automotivo')">🚗 Automotivo</button>
    <button class="cat-pill" data-cat="Lavanderia" onclick="filtrarCat(this,'Lavanderia')">👕 Lavanderia</button>
    <button class="cat-pill" data-cat="Especial" onclick="filtrarCat(this,'Especial')">⭐ Especial</button>
    <button class="cat-pill" data-cat="Limpeza de Piso" onclick="filtrarCat(this,'Limpeza de Piso')">✨ Limpeza de Piso</button>
    <button class="cat-pill" data-cat="Limpeza de Piscina" onclick="filtrarCat(this,'Limpeza de Piscina')">🏊 Limpeza de Piscina</button>
  </div>
</header>

<div class="search-wrap">
  <input type="search" id="busca" placeholder="🔍  Buscar produto..." oninput="filtrar()" autocomplete="off">
</div>

<div class="grid" id="grid"></div>

<!-- MODAL PRODUTO -->
<div class="overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="fecharModalBtn()">✕</button>
      <span style="font-size:.75rem;color:#aaa;font-style:italic" id="modalCat"></span>
    </div>
    <div class="modal-img"><img id="modalImg" src="" alt=""></div>
    <div class="modal-body">
      <div class="modal-nome" id="modalNome"></div>
      <div class="modal-sub" id="modalSub"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-precos">
        <h4>Tamanhos e preços</h4>
        <div id="modalPrecos"></div>
      </div>
    </div>
  </div>
</div>

<!-- CARRINHO -->
<div class="cart-overlay" id="cartOverlay" onclick="fecharCarrinhoEv(event)">
  <div class="cart-modal">
    <div class="cart-header">
      <h2>🛒 Meu Pedido</h2>
      <button class="modal-close" onclick="fecharCarrinho()">✕</button>
    </div>
    <div id="cartContent"></div>
  </div>
</div>

<button class="wa-fab" onclick="abrirWhatsAppGeral()" aria-label="Falar no WhatsApp">
  <svg viewBox="0 0 24 24">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
    <path d="M12 0C5.373 0 0 5.373 0 12c0 2.121.555 4.112 1.528 5.837L.057 23.888l6.218-1.448A11.934 11.934 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.848 0-3.57-.502-5.051-1.378l-.361-.214-3.741.87.936-3.618-.235-.374A9.966 9.966 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
  </svg>
</button>

<div class="toast" id="toast"></div>

<script>
const PRODUTOS = [
{id:"amoniex",cat:"Limpeza Geral",nome:`Amoniex`,sub:`Detergente Amoniacal`,desc:`Remove sujeiras pesadas de roupas, tapetes, azulejos, coifas, exaustores, fornos e fogões. Também limpa fuligem e lodo em cerâmicas, granitos e mármores — quando o produto comum não resolve, o Amoniex resolve.`,precos:[["2L", "R$ 19,99", "COD 20358"], ["5L", "R$ 39,99", "COD 20356"], ["20L / 50L", "Consulte", ""]],img:"campar_img/amoniex.jpg"},
{id:"detmais",cat:"Limpeza Geral",nome:`Detmais`,sub:`Detergente Neutro`,desc:`O parceiro do dia a dia para limpeza de qualquer superfície. Fórmula neutra que limpa sem agredir, sem deixar resíduos e sem danificar o que você está limpando.`,precos:[["500mL", "R$ 4,99", "COD 20349"], ["2L", "Consulte", ""], ["5L", "R$ 29,99", "COD 20350"], ["20L / 50L", "Consulte", ""]],img:"campar_img/detmais.jpg"},
{id:"chapexo",cat:"Limpeza Geral",nome:`Chapexo`,sub:`Desincrustante de Chapas, Coifas e Exaustores`,desc:`Especialista em desincrustação de superfícies metálicas com gordura e óleos impregnados. Ideal para cozinhas que precisam de limpeza profunda nas chapas, coifas e exaustores. Dissolve o que outros produtos deixam pra trás.`,precos:[["5L", "R$ 78,00", ""]],img:"campar_img/chapexo.jpg"},
{id:"nullbac",cat:"Limpeza Geral",nome:`Nullbac`,sub:`Limpador Instantâneo`,desc:`Limpeza imediata antes e depois do uso de equipamentos, bancadas, paredes e pisos. Ação rápida e efeito prolongado — ideal para ambientes de alto tráfego que exigem higiene constante.`,precos:[["5L", "R$ 78,99", "COD 20280"]],img:"campar_img/nullbac.jpg"},
{id:"easy_clean",cat:"Limpeza Geral",nome:`Easy Clean`,sub:`Flotador Multiuso – Limpeza Pesada`,desc:`Formulado para flotação e desagregação de partículas de sujidade nas superfícies de equipamentos mecânicos. Quando a sujeira está impregnada e os produtos comuns não chegam lá, o Easy Clean faz o trabalho.`,precos:[["5L / 20L / 50L", "Consulte", ""]],img:"campar_img/easy_clean.jpg"},
{id:"gel_mix_pinho",cat:"Limpeza Geral",nome:`Gel Mix Pinho`,sub:`Detergente Gel`,desc:`Alto poder de solubilização de óleos, gorduras e graxas com aroma fresco de pinho. Indicado para azulejos, banheiros, pisos e sanitários. Gel de alta viscosidade que adere à superfície e age melhor.`,precos:[["2L / 5L", "Consulte", ""]],img:"campar_img/gel_mix_pinho.jpg"},
{id:"gel_mix_lavanda",cat:"Limpeza Geral",nome:`Gel Mix Lavanda`,sub:`Detergente Gel`,desc:`Mesma potência do Gel Mix com aroma suave de lavanda. Limpa azulejos, banheiros e sanitários com eficiência, deixando o ambiente com perfume relaxante.`,precos:[["2L / 5L", "Consulte", ""]],img:"campar_img/gel_mix_lavanda.jpg"},

{id:"aqua123",cat:"Limpeza de Piscina",nome:`Aqua 123`,sub:`Clarificante`,desc:`Usado para limpar água com grande sujidade. Promove a aglutinação da sujeira, facilitando a remoção por filtragem ou aspiração.`,precos:[["1L / 5L", "Consulte", ""]],img:"campar_img/placeholder.svg"}
];

let catAtiva = "Todos";
let carrinho = JSON.parse(localStorage.getItem('campar_carrinho') || '[]');
let modalQtd = {};

function salvarCarrinho() {
  localStorage.setItem('campar_carrinho', JSON.stringify(carrinho));
}

function precoNum(str) {
  const v = parseFloat(str.replace('R$','').replace(',','.').trim());
  return isNaN(v) ? null : v;
}

function subtotalItem(i) {
  const v = precoNum(i.preco);
  return v === null ? i.preco : 'R$ ' + (v * i.qtd).toFixed(2).replace('.',',');
}

// ── RENDER GRID ───────────────────────────────────────────────
function render() {
  const busca = document.getElementById('busca').value.toLowerCase().trim();
  const grid = document.getElementById('grid');
  
  const filtrados = PRODUTOS.filter(p => {
    const matchCat = catAtiva === "Todos" || p.cat === catAtiva;
    const matchBusca = !busca || 
      p.nome.toLowerCase().includes(busca) || 
      p.sub.toLowerCase().includes(busca) ||
      p.desc.toLowerCase().includes(busca);
    return matchCat && matchBusca;
  });

  if (!filtrados.length) {
    grid.innerHTML = '<div class="no-results">Nenhum produto encontrado 🔍</div>';
    return;
  }

  grid.innerHTML = filtrados.map(p => {
    const preco = p.precos[0];
    const isConsulte = preco[1] === "Consulte";
    return `
    <div class="card" onclick="abrirModal('${p.id}')">
      <div class="card-img">
        <span class="cat-tag">${p.cat}</span>
        <img src="${p.img}" alt="${p.nome}" loading="lazy">
      </div>
      <div class="card-body">
        <div class="card-nome">${p.nome}</div>
        <div class="card-sub">${p.sub}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-precos">
          ${p.precos.slice(0,2).map(pr => `
          <div class="preco-item">
            <span class="preco-tam">${pr[0]}</span>
            <div style="text-align:right">
              <div class="preco-val">${pr[1]}</div>
              ${pr[2] ? `<div class="preco-cod">${pr[2]}</div>` : ''}
            </div>
          </div>`).join('')}
        </div>
        <button class="add-btn ${isConsulte ? 'consulte' : ''}" onclick="addRapido(event,'${p.id}')">
          ${isConsulte ? '💬 Solicitar orçamento' : '＋ Adicionar ao pedido'}
        </button>
      </div>
    </div>`;
  }).join('');
}

// ── FILTRO CATEGORIA ─────────────────────────────────────────
function filtrarCat(el, cat) {
  catAtiva = cat;
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('ativo'));
  el.classList.add('ativo');
  render();
}
function filtrar() { render(); }

// ── MODAL PRODUTO ────────────────────────────────────────────
function abrirModal(id) {
  const p = PRODUTOS.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modalCat').textContent = p.cat;
  document.getElementById('modalImg').src = p.img;
  document.getElementById('modalImg').alt = p.nome;
  document.getElementById('modalNome').textContent = p.nome;
  document.getElementById('modalSub').textContent = p.sub;
  document.getElementById('modalDesc').textContent = p.desc;
  
  modalQtd = {};
  const pc = document.getElementById('modalPrecos');
  pc.innerHTML = p.precos.map((pr,i) => {
    modalQtd[i] = 1;
    const isConsulte = pr[1] === "Consulte";
    return `
    <div class="modal-preco-row">
      <div class="mp-top">
        <div class="mp-left">
          <span class="mp-tam">${pr[0]}</span>
          ${pr[2] ? `<span class="mp-cod">${pr[2]}</span>` : ''}
        </div>
        <span class="mp-val">${pr[1]}</span>
      </div>
      <div class="mp-bottom">
        <div class="mp-qty">
          <button class="qty-btn" onclick="alterarModalQtd(${i},-1)">−</button>
          <span class="qty-val" id="modalQtdVal${i}">1</span>
          <button class="qty-btn" onclick="alterarModalQtd(${i},1)">+</button>
        </div>
        <button class="mp-add ${isConsulte ? 'consulte' : ''}" onclick="addCarrinho('${id}',${i},modalQtd[${i}]);fecharModalBtn()">
          ${isConsulte ? '💬 Orçamento' : '＋ Adicionar'}
        </button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function alterarModalQtd(i, delta) {
  modalQtd[i] = Math.max(1, (modalQtd[i] || 1) + delta);
  document.getElementById(`modalQtdVal${i}`).textContent = modalQtd[i];
}
function fecharModal(e) {
  if (e.target === document.getElementById('modalOverlay')) fecharModalBtn();
}
function fecharModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── CARRINHO ─────────────────────────────────────────────────
function addRapido(e, id) {
  e.stopPropagation();
  addCarrinho(id, 0);
}

function addCarrinho(id, precoIdx, qtd) {
  qtd = qtd || 1;
  const p = PRODUTOS.find(x => x.id === id);
  if (!p) return;
  const pr = p.precos[precoIdx];
  const existente = carrinho.find(i => i.id === id && i.tam === pr[0]);
  if (existente) {
    existente.qtd += qtd;
  } else {
    carrinho.push({
      id, nome: p.nome, tam: pr[0], preco: pr[1], img: p.img, qtd,
      uid: Date.now() + Math.random()
    });
  }
  salvarCarrinho();
  atualizarBadge();
  showToast(`${p.nome} adicionado ✓`);
}

function alterarQtdCarrinho(uid, delta) {
  const item = carrinho.find(i => i.uid === uid);
  if (!item) return;
  item.qtd += delta;
  if (item.qtd <= 0) {
    carrinho = carrinho.filter(i => i.uid !== uid);
  }
  salvarCarrinho();
  atualizarBadge();
  renderCarrinho();
}

function removerItem(uid) {
  carrinho = carrinho.filter(i => i.uid !== uid);
  salvarCarrinho();
  atualizarBadge();
  renderCarrinho();
}

function atualizarBadge() {
  const b = document.getElementById('cartBadge');
  const total = carrinho.reduce((acc,i) => acc + i.qtd, 0);
  b.textContent = total;
  b.style.display = total ? 'flex' : 'none';
}

function abrirCarrinho() {
  renderCarrinho();
  document.getElementById('cartOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function fecharCarrinho() {
  document.getElementById('cartOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function fecharCarrinhoEv(e) {
  if (e.target === document.getElementById('cartOverlay')) fecharCarrinho();
}

function renderCarrinho() {
  const el = document.getElementById('cartContent');
  if (!carrinho.length) {
    el.innerHTML = `
      <div class="cart-empty">
        <div style="font-size:2.5rem;margin-bottom:10px">🛒</div>
        <div>Seu pedido está vazio</div>
        <div style="margin-top:6px;font-size:.8rem">Adicione produtos para fazer seu pedido</div>
      </div>`;
    return;
  }

  const totalNum = carrinho.reduce((acc,i) => {
    const v = precoNum(i.preco);
    return v === null ? acc : acc + v * i.qtd;
  }, 0);

  const totalStr = totalNum > 0
    ? 'R$ ' + totalNum.toFixed(2).replace('.',',')
    : '(consulte preços)';

  el.innerHTML = `
    <div class="cart-items">
      ${carrinho.map(i => `
      <div class="cart-item">
        <img class="ci-img" src="${i.img}" alt="${i.nome}">
        <div class="ci-info">
          <div class="ci-nome">${i.nome}</div>
          <div class="ci-tam">${i.tam}</div>
          <div class="ci-qty">
            <button class="qty-btn" onclick="alterarQtdCarrinho(${i.uid},-1)">−</button>
            <span class="qty-val">${i.qtd}</span>
            <button class="qty-btn" onclick="alterarQtdCarrinho(${i.uid},1)">+</button>
          </div>
        </div>
        <div class="ci-preco">${subtotalItem(i)}</div>
        <button class="ci-remove" onclick="removerItem(${i.uid})" title="Remover">🗑</button>
      </div>`).join('')}
    </div>
    <div class="cart-total">
      <span class="total-label">Total estimado</span>
      <span class="total-val">${totalStr}</span>
    </div>
    <button class="wa-btn" onclick="enviarWA()">
      <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.121.555 4.112 1.528 5.837L.057 23.888l6.218-1.448A11.934 11.934 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.848 0-3.57-.502-5.051-1.378l-.361-.214-3.741.87.936-3.618-.235-.374A9.966 9.966 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
      </svg>
      Enviar pedido pelo WhatsApp
    </button>`;
}

function enviarWA() {
  if (!carrinho.length) return;
  let msg = "Olá! Gostaria de fazer o seguinte pedido:\n\n";
  carrinho.forEach((i,idx) => {
    msg += `${idx+1}. ${i.nome} – ${i.tam} × ${i.qtd} (${subtotalItem(i)})\n`;
  });

  const totalNum = carrinho.reduce((acc,i) => {
    const v = precoNum(i.preco);
    return v === null ? acc : acc + v * i.qtd;
  }, 0);
  if (totalNum > 0) {
    msg += "\nTotal estimado: R$ " + totalNum.toFixed(2).replace('.',',');
  }
  msg += "\n\nPoderia confirmar disponibilidade e formas de entrega? Obrigado(a)!";

  const url = `https://wa.me/5531986991635?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function abrirWhatsAppGeral() {
  const msg = "Olá! Vim pelo catálogo da Campar Química e gostaria de tirar uma dúvida.";
  window.open(`https://wa.me/5531986991635?text=${encodeURIComponent(msg)}`, '_blank');
}

// ── TOAST ────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── INIT ─────────────────────────────────────────────────────
render();
atualizarBadge();
</script>
